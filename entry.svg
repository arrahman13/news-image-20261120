<text x="767" y="627" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">Iraqi forces enter</text>
<text x="767" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">militia stronghold</text>
<text x="767" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">Baghdad's forces will deploy in</text>
<text x="767" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">Jurf al-Sakhar, bastion of</text>
<text x="767" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">Iran-backed Kataib Hezbollah,</text>
<text x="767" y="718" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">under a compromise to calm</text>
<text x="767" y="734" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">tensions.</text>
