<text x="54" y="192" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#9e1b1b" text-anchor="start">UKRAINE WAR · BERLIN AND KYIV · THE DAY AFTER SHENZHEN</text>
<text x="54" y="249" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="bold" fill="#191512" text-anchor="start">EUROPE DEMANDS A SEAT</text>
<text x="54" y="307" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="bold" fill="#191512" text-anchor="start">AT THE UKRAINE TABLE</text>
<text x="54" y="339" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="normal" fill="#191512" text-anchor="start">Left out at Shenzhen, Ukraine's allies met in Berlin and closed ranks against any peace deal cut over</text>
<text x="54" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="normal" fill="#191512" text-anchor="start">their heads. US envoy Jared Kushner floated a NATO-style Article 5 guarantee for Kyiv, Merz attacked the</text>
<text x="54" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="normal" fill="#191512" text-anchor="start">three-power format, and Putin invited the Europeans to Moscow. As they talked, Russian missiles struck</text>
<text x="54" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="normal" fill="#191512" text-anchor="start">Kyiv overnight: three killed, nine injured, all three Dnipro bridges closed.</text>
