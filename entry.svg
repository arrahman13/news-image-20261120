<text x="47" y="627" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">Asia rout deepens</text>
<text x="47" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">the AI sell-off</text>
<text x="47" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">The Nikkei fell 4.8% and SoftBank</text>
<text x="47" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">plunged 16% as the AI rout</text>
<text x="47" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">spread from Wall Street, where</text>
<text x="47" y="718" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">the S&amp;P 500 fell 2% for a fifth</text>
<text x="47" y="734" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">straight day.</text>
