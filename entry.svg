<text x="287" y="887" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">Jinping on Friday to discuss</text>
<text x="287" y="903" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">investment and South China Sea</text>
<text x="287" y="919" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">cooperation.</text>
