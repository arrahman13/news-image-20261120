<rect x="516" y="580" width="230" height="5" fill="#6e3c8c"/>
<text x="527" y="602" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#6e3c8c" text-anchor="start">TECHNOLOGY · CALIFORNIA</text>
<text x="527" y="627" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">California</text>
<text x="527" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">subpoenas Nvidia</text>
<text x="527" y="673" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">over China chips</text>
<text x="527" y="693" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">The probe follows CEO Jensen</text>
<text x="527" y="709" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">Huang's exit. A House panel says</text>
<text x="527" y="725" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">US licences approved 879,000 AI</text>
<text x="527" y="741" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">chip sales to China.</text>
