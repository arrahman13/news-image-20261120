<text x="287" y="602" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e6e4c" text-anchor="start">CLIMATE · ANTALYA</text>
<text x="287" y="627" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">COP31 draft drops</text>
<text x="287" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">fossil-fuel exit</text>
<text x="287" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">On the final day in Antalya,</text>
<text x="287" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">negotiators cut the fossil-fuel</text>
<text x="287" y="702" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">phase-out call and the net-zero</text>
<text x="287" y="718" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">dates from the draft. Pacific</text>
<text x="287" y="734" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">nations demanded both back.</text>
