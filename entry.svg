<text x="47" y="805" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">UK and EU near</text>
<text x="47" y="828" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">youth mobility deal</text>
<text x="47" y="848" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">Friday's Brussels summit is set to</text>
<text x="47" y="864" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">approve a youth mobility scheme,</text>
<text x="47" y="880" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">with food trade and carbon deals</text>
<text x="47" y="896" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#342f28" text-anchor="start">also on the table.</text>
