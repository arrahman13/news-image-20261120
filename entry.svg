<text x="287" y="805" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">Prabowo and Xi</text>
<text x="287" y="828" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#191512" text-anchor="start">talk South China</text>
